<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" type="image/png" href="images/icons/favicon.png">
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <ul>
          <li><a href="index.html#still-winters">Still Winters</a></li>
          <li><a href="index.html#kysiko">Kysiko</a></li>
          <li><a href="musicforpicture.html">Music For Picture</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="gallerypage">
        <div>
          <h2>Gallery</h2>
          <div id="gallery"></div>
        </div>
      </section>
    </main>

    <footer>
      <h5><b>CONTACT</b></h5>
      <p>stillwintersproject@gmail.com</p>
      <p>kysikoprojects@gmail.com</p>
      <p>originalscorebyjeremyalain@gmail.com</p>
      <p>
        <img src="images/icons/insta_icon_b.png" alt="instaicon" width="20" style="vertical-align:middle;"/>

        |
        <a href="https://www.instagram.com/kysiko">@kysiko</a>
      </p>
    </footer>
  </div>

  <!-- Script to auto-generate gallery -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const gallery = document.getElementById("gallery");

    // Adjust these values as needed
    const folder = "images/gallery/";
    const count = 11;   // number of images you currently have
    const ext = ".jpg"; // change if your files are .png, etc.

    for (let i = 0; i < count; i++) {
      const num = String(i).padStart(3, "0"); // creates 000, 001, 002 ...
      const img = document.createElement("img");
      img.src = `${folder}sw_photo_${num}${ext}`;
      img.alt = `sw_photo_${num}`;
      img.width = 375; // matches your CSS
      img.loading = "lazy";
      gallery.appendChild(img);
    }
  });
  </script>
</body>
</html>
